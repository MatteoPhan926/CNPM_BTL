<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Hệ thống quản lý thuê xe điện, đặt chỗ đỗ, sạc điện và điều hành mạng lưới Mobility Hub.">
  <title>Smart E-Mobility Hub</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/network.js" defer></script>
  <script src="/parking-qr.js" defer></script>
  <script src="/service-bookings.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Chuyển đến nội dung chính</a>
  <div id="app"></div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="detail-dialog"><div id="detail-content"></div><button id="close-dialog" class="secondary">Đóng</button></dialog>
  <dialog id="parking-qr-dialog" aria-labelledby="parking-qr-title"><div id="parking-qr-content"></div><p id="parking-qr-feedback" class="spaced" role="alert" hidden></p><button id="close-parking-qr" class="secondary">Đóng</button></dialog>
  <dialog id="service-qr-dialog" aria-labelledby="service-qr-title"><div id="service-qr-content"></div><p id="service-qr-feedback" class="spaced" role="alert" hidden></p><button id="close-service-qr" class="secondary">Đóng</button></dialog>
</body>
</html>
