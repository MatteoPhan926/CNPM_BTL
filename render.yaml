services:
  - type: web
    name: smart-emobility-abcd-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python -m emobility.cloud_server --auto-refresh
    healthCheckPath: /api/health
    envVars:
      - key: EMOBILITY_ALICE_PASSWORD
        sync: false
      - key: EMOBILITY_BOB_PASSWORD
        sync: false
      - key: EMOBILITY_OPERATOR_PASSWORD
        sync: false
      - key: EMOBILITY_DISPATCHER_PASSWORD
        sync: false
      - key: EMOBILITY_TECHNICIAN_PASSWORD
        sync: false
