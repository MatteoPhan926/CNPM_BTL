<script>const previewStore=(()=>{const m=new Map();return {getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k)}})();</script><script>/* Preview-only in-browser data adapter. NOT the Python/SQLite backend. */
(() => {
  'use strict';
  const roles = {alice:'student', bob:'student', operator:'operator', dispatcher:'dispatcher', technician:'technician'};
  const creds = {alice:'alice-demo', bob:'bob-demo', operator:'operator-demo', dispatcher:'dispatcher-demo', technician:'technician-demo'};
  const sec = () => Date.now()/1000;
  const uid = prefix => prefix + '-' + Math.random().toString(36).slice(2,10).toUpperCase();
  const keys = ['hubs','vehicles','spots','ports','holds','trips','rights','visits','sessions','incidents','commands','plans','audit','orders','scenarios'];
  const storeKey = 'emobility_html_preview_demo_v2';
  let db;
  const emptyDb = () => {
    const o=Object.fromEntries(keys.map(k=>[k,[]]));
    const t=sec();
    ['Metro Gateway','University Campus','Dormitory'].forEach((name,i)=>{
      const id='H'+(i+1);o.hubs.push({id,name,power_kw:7.4,capacity:10,open:true});
      for(let j=1;j<=10;j++){
        const spotId=`${id}-S${j}`;
        o.spots.push({id:spotId, hub_id:id, state:'EMPTY', vehicle_id:null, health:'OPERABLE', freshness:'FRESH', observed_at:t,sequence:1});
        if(j<=2)o.ports.push({id:`${id}-C${j}`,spot_id:spotId, hub_id:id, connector:'TYPE2',kw:3.7,plug:'UNPLUGGED',power:'OFF',health:'OPERABLE',freshness:'FRESH',observed_at:t,sequence:1});
      }
    });
    [['V1','shared',null,'H1','H1-S3',75],['V2','shared',null,'H2','H2-S3',45],['V3','shared',null,'H1','H1-S1',68],['P1','personal','alice',null,null,30],['P2','personal','bob',null,null,40]].forEach(([id,kind,owner_id,hub_id,spot_id,soc])=>{
      o.vehicles.push({id,label:id,kind,owner_id,hub_id,spot_id,soc,battery_kwh:2,connector:'TYPE2',health:'OPERABLE',freshness:'FRESH',observed_at:t,transferable:kind==='shared',available:kind==='shared',sequence:1});
      if(spot_id){const s=o.spots.find(x=>x.id===spot_id);s.state='OCCUPIED';s.vehicle_id=id;o.visits.push({id:'seed-'+id,owner_id:'operator',vehicle_id:id,spot_id,status:'PARKED',arrived_at:t});}
    });
    o.revision=1;return o;
  };
  const recover = () => {try{ const s=JSON.parse(previewStore.getItem(storeKey)); return s&&Array.isArray(s.vehicles)&&Array.isArray(s.hubs)?s:null;}catch{return null;}};
  db = recover() || emptyDb();
  const persist = () => {try{previewStore.setItem(storeKey,JSON.stringify(db));}catch{}};
  let account = null;
  const obj=(key,id)=>db[key].find(r=>r.id===id);
  const add=(key,fields)=>{const r={id:uid(key.slice(0,-1)||key),...fields};db[key].push(r);return r;};
  const requireItem=(key,id)=>{const x=obj(key,id);if(!x)throw new Error(`${key}: record not found (${id})`);return x;};
  const audit=(action)=>add('audit',{at:sec(),actor_id:account,action});
  const pickBay=(hub,charging=false)=>db.spots.find(s=>s.hub_id===hub && s.state==='EMPTY' && s.health==='OPERABLE' && (!charging||db.ports.some(p=>p.spot_id===s.id && p.health==='OPERABLE')));
  const command=(kind,row,extra={})=>add('commands',{kind,record_id:row.id,owner_id:account,vehicle_id:row.vehicle_id || extra.vehicle_id,status:'PENDING',created_at:sec(),...extra});
  const bookSession=(right,target_soc)=>{const port=db.ports.find(p=>p.spot_id===right.spot_id) || db.ports.find(p=>p.hub_id===right.hub_id && p.health==='OPERABLE');if(!port)throw new Error('No charging port at this location');return add('sessions',{owner_id:account,vehicle_id:right.vehicle_id,right_id:right.id,port_id:port.id,status:'BOOKED',start:right.start,end:right.end,scheduled_start:right.start,scheduled_end:right.end,kw:3.7,target_soc:Number(target_soc||80)});};
  const visible=(key)=>{
    if (['operator','dispatcher','technician'].includes(roles[account])) return db[key];
    if(['vehicles','hubs','spots','ports'].includes(key))return db[key];
    if(key==='audit'||key==='commands')return [];
    return db[key].filter(row=>row.owner_id===account);
  };
  const snapshot=()=>{
    const now=sec();
    const hubs=db.hubs.map(h=>{
      const bays=db.spots.filter(s=>s.hub_id===h.id);
      const occupied=bays.filter(s=>s.state==='OCCUPIED').length;
      const unknown=bays.filter(s=>s.state==='UNKNOWN').length;
      const held=db.rights.filter(r=>r.hub_id===h.id && ['CONFIRMED','HANDOVER_PENDING'].includes(r.status)).length;
      return {...h,occupied,unknown,held,available:Math.max(0,10-occupied-held-unknown),effective_percent:Math.round(100*(occupied+held+unknown)/10),level:'OPEN'};
    });
    const vehicles=db.vehicles.map(v=>({...v,available:v.kind==='shared'&&v.health==='OPERABLE'&&v.hub_id!=null&&!v.transfer_order_id&&!db.holds.some(h=>h.vehicle_id===v.id&&['ACTIVE','HANDOVER_PENDING'].includes(h.status))&&!db.trips.some(t=>t.vehicle_id===v.id&&t.status!=='CLOSED'),freshness:'FRESH'}));
    const o={revision:db.revision,now,simulator:true,actor:{id:account,role:roles[account]},hubs,vehicles};
    for(const k of keys)if(!(k in o))o[k]=structuredClone(visible(k));
    return o;
  };
  const doAck=(c)=>{
    const p = c, kind=c.kind;
    const record=(key)=>obj(key,c.record_id);
    if(kind==='PICKUP'){
      const h=record('holds'); if(h){h.status='CONSUMED';const v=obj('vehicles',h.vehicle_id); const previous=v.spot_id;v.hub_id=null;v.spot_id=null;const s=obj('spots',previous);if(s){s.state='EMPTY';s.vehicle_id=null;}
        const visit=db.visits.find(x=>x.vehicle_id===v.id&&x.status==='PARKED');if(visit)visit.status='DEPARTED';
        add('trips',{owner_id:h.owner_id,vehicle_id:h.vehicle_id,hold_id:h.id,status:'ACTIVE',started_at:sec()});}}
    else if(kind==='RETURN'){
      const t=record('trips');if(t){const v=obj('vehicles',t.vehicle_id);const spot=pickBay(c.hub_id)||db.spots.find(s=>s.hub_id===c.hub_id);if(spot){spot.state='OCCUPIED';spot.vehicle_id=v.id;v.spot_id=spot.id;}v.hub_id=c.hub_id;t.status='CLOSED';t.ended_at=sec();add('visits',{owner_id:t.owner_id,vehicle_id:v.id,spot_id:v.spot_id,status:'PARKED',arrived_at:sec()});}}
    else if(kind==='ARRIVE'){
      const r=record('rights');if(r){r.status='CONSUMED';const spot=obj('spots',r.spot_id);if(spot){spot.state='OCCUPIED';spot.vehicle_id=r.vehicle_id;}
       const v=obj('vehicles',r.vehicle_id);if(v){v.hub_id=r.hub_id;v.spot_id=r.spot_id;}add('visits',{owner_id:r.owner_id,vehicle_id:r.vehicle_id,spot_id:r.spot_id,right_id:r.id,status:'PARKED',arrived_at:sec()});}}
    else if(kind==='DEPART'){
      const visit=record('visits');if(visit){visit.status='DEPARTED';const spot=obj('spots',visit.spot_id);if(spot){spot.state='EMPTY';spot.vehicle_id=null;}const v=obj('vehicles',visit.vehicle_id);if(v){v.hub_id=null;v.spot_id=null;}}}
    else if(['PLUG','START','STOP','UNPLUG'].includes(kind)){
      const session=record('sessions');if(session){const port=obj('ports',session.port_id);
       if(kind==='PLUG'&&port){port.plug='CONNECTED';port.vehicle_id=session.vehicle_id;session.status='BOOKED';}
       if(kind==='START'){session.status='CHARGING';if(port)port.power='ON';}
       if(kind==='STOP'){session.status='COMPLETED';if(port)port.power='OFF';}
       if(kind==='UNPLUG'&&port){port.plug='UNPLUGGED';port.vehicle_id=null;}}
    }
    else if(kind==='TRANSFER'){
      const order=record('orders');const vehicle=obj('vehicles',c.vehicle_id);
      if(order&&vehicle){order.delivered=order.delivered||[];order.pending=(order.pending||[]).filter(v=>v!==vehicle.id);order.delivered.push(vehicle.id);order.status=order.delivered.length===order.vehicle_ids.length?'COMPLETED':'IN_PROGRESS';vehicle.hub_id=order.dest_hub_id;vehicle.spot_id=(pickBay(order.dest_hub_id)||{}).id||null;vehicle.transfer_order_id=null;const target=obj('spots',vehicle.spot_id);if(target){target.state='OCCUPIED';target.vehicle_id=vehicle.id;}}
    }
  };
  const dispatch=(action,p={})=>{
    let r, item, t=sec();
    switch(action){
      case 'reserve_vehicle': {
        const v=requireItem('vehicles',p.vehicle_id); if(db.holds.some(h=>h.vehicle_id===v.id&&h.status==='ACTIVE'))throw new Error('This vehicle is already reserved');
        r=add('holds',{owner_id:account,vehicle_id:v.id,status:'ACTIVE',created_at:t,expires_at:t+600});break;}
      case 'cancel_hold':r=requireItem('holds',p.hold_id);r.status='CANCELLED';break;
      case 'pickup':r=requireItem('holds',p.hold_id);r.status='HANDOVER_PENDING';r=command('PICKUP',r);break;
      case 'return_vehicle':r=requireItem('trips',p.trip_id);r.status='HANDOVER_PENDING';r=command('RETURN',r,{hub_id:p.hub_id});break;
      case 'register_vehicle':r=add('vehicles',{owner_id:account,kind:'personal',label:p.label,hub_id:null,spot_id:null,soc:Number(p.soc),battery_kwh:Number(p.battery_kwh),connector:p.connector,health:'OPERABLE',freshness:'FRESH',observed_at:t});break;
      case 'reserve_parking': {
        const spot=pickBay(p.hub_id,!!p.charging);if(!spot)throw new Error('No eligible parking bay in preview');
        r=add('rights',{owner_id:account,vehicle_id:p.vehicle_id,hub_id:p.hub_id,spot_id:spot.id,start:Number(p.start),end:Number(p.end),status:'CONFIRMED',created_at:t});
        if(p.charging)bookSession(r,p.target_soc);break;}
      case 'cancel_parking':r=requireItem('rights',p.right_id);r.status='CANCELLED';break;
      case 'arrive':r=requireItem('rights',p.right_id);r.status='HANDOVER_PENDING';r=command('ARRIVE',r);break;
      case 'depart':r=requireItem('visits',p.visit_id);r.status='DEPART_PENDING';r=command('DEPART',r);break;
      case 'register_charge':r=bookSession(requireItem('rights',p.right_id),p.target_soc);break;
      case 'plug': r=command('PLUG',requireItem('sessions',p.session_id));break;
      case 'start_charge': {const s=requireItem('sessions',p.session_id);s.status='START_PENDING';r=command('START',s);break;}
      case 'stop_charge': {const s=requireItem('sessions',p.session_id);s.status='STOP_PENDING';r=command('STOP',s);break;}
      case 'unplug': r=command('UNPLUG',requireItem('sessions',p.session_id));break;
      case 'cancel_charge': r=requireItem('sessions',p.session_id);r.status='CANCELLED';break;
      case 'support':r=add('incidents',{owner_id:account,record_id:p.record_id,message:p.message,status:'OPEN',created_at:t,kind:'SUPPORT'});break;
      case 'sim_refresh': for(const k of ['vehicles','spots','ports'])db[k].forEach(x=>{x.observed_at=t;x.freshness='FRESH'});r={status:'SIMULATED'};break;
      case 'sim_observe': {r=requireItem(p.resource_type,p.resource_id);r.health=p.health||r.health;r.observed_at=t;break;}
      case 'simulate': {r=requireItem('commands',p.command_id);r.status=p.outcome==='REJECT'?'REJECTED':p.outcome==='UNKNOWN'?'PENDING':'ACKNOWLEDGED';if(p.outcome==='ACK')doAck(r);break;}
      case 'schedule_preview':r=add('plans',{owner_id:account,kind:'SCHEDULE',status:'DRAFT',allocations:[],created_at:t});break;
      case 'schedule_confirm':r=requireItem('plans',p.plan_id);r.status='APPLIED';break;
      case 'fleet_charge': {const v=requireItem('vehicles',p.vehicle_id); const right=add('rights',{owner_id:account,vehicle_id:v.id,hub_id:v.hub_id,spot_id:v.spot_id,start:t,end:t+3600,status:'CONSUMED'});r=bookSession(right,p.target_soc);break;}
      case 'capacity_plan':r=add('plans',{owner_id:account,kind:'capacity',status:'DRAFT',hub_id:p.hub_id});break;
      case 'accept_capacity':r=requireItem('incidents',p.incident_id);r.status=p.accept?'ACCEPTED':'DECLINED';break;
      case 'transfer_preview':r=add('orders',{owner_id:account,source_hub_id:p.source_hub_id,dest_hub_id:p.dest_hub_id,vehicle_ids:p.vehicle_ids||[],staff_id:p.staff_id||'dispatcher',status:'DRAFT',charging_bays:!!p.charging_bays,delivered:[],pending:[]});break;
      case 'transfer_issue':r=requireItem('orders',p.order_id);r.status='ISSUED';break;
      case 'transfer_start':r=requireItem('orders',p.order_id);r.status='IN_PROGRESS';break;
      case 'transfer_handover': {
        const o=requireItem('orders',p.order_id);o.pending=o.pending||[];
        for(const vid of p.vehicle_ids||[]){o.pending.push(vid);command('TRANSFER',o,{vehicle_id:vid});}r=o;break;}
      case 'd_resource_state':r=db.vehicles.find(v=>v.id===p.resource_id)||db.spots.find(x=>x.id===p.resource_id)||db.ports.find(x=>x.id===p.resource_id);if(!r)throw new Error('Unknown resource');r.health=p.active?'OPERABLE':'DEACTIVATED';break;
      case 'd_open_incident':r=add('incidents',{owner_id:account,kind:'MAINTENANCE',record_id:p.resource_id,resource_id:p.resource_id,message:p.message,status:'OPEN',technician_id:'technician',created_at:t});break;
      case 'd_update_incident':r=requireItem('incidents',p.incident_id);r.status=p.outcome||'RESOLVED';r.response=p.note||'';break;
      case 'what_if': {
        const impact=db.hubs.map(h=>({hub_id:h.id,current_percent:20,projected_percent:Math.min(100,Math.round(h.id===p.hub_id?20*Number(p.demand_factor):20))}));
        r=add('scenarios',{owner_id:account,hub_id:p.hub_id,demand_factor:Number(p.demand_factor),impact,recommendations:[]});break;}
      case 'what_if_draft':r=add('orders',{owner_id:account,source_hub_id:'H1',dest_hub_id:'H2',vehicle_ids:['V1'],staff_id:'dispatcher',status:'DRAFT',delivered:[],pending:[]});break;
      case 'd_telemetry': {
        r=requireItem('vehicles',p.resourceId);
        r.last_telemetry={resourceId:r.id,observed_at:t,batterySoc:Number(p.batterySoc),speed:Number(p.speed||0),temperatureC:Number(p.temperatureC||27),destinationHubId:p.destinationHubId,sequence:(r.sequence||0)+1,alerts:Number(p.batterySoc)<20?['LOW_BATTERY']:[]};break;}
      default: throw new Error('This operation requires the real Python backend: '+action);
    }
    db.revision++;audit(action);persist();
    return {status:['PICKUP','RETURN','ARRIVE','DEPART','PLUG','START','STOP','UNPLUG','TRANSFER'].includes(r?.kind)?'PENDING_VERIFICATION':'CONFIRMED',code:'OK',record:r,revision:db.revision};
  };
  const resp=(body,status=200)=>new Response(JSON.stringify(body),{status,headers:{'Content-Type':'application/json'}});
  const nativeFetch=window.fetch.bind(window);
  window.fetch=async(input,options={})=>{
    const url=typeof input==='string'?input:String(input.url||'');
    if(!url.startsWith('/api/'))return nativeFetch(input,options);
    let data={};try{data=options.body?JSON.parse(options.body):{};}catch{return resp({error:{code:'JSON',message:'Invalid request'}},400);}
    if(url==='/api/health')return resp({status:'ok',simulator:true,preview:true});
    if(url==='/api/login'){
      if(!(data.username in creds)||creds[data.username]!==data.password)return resp({error:{code:'LOGIN',message:'Wrong demo credentials'}},401);
      account=data.username;return resp({actor:{id:account,role:roles[account]}});
    }
    if(url==='/api/logout'){account=null;return resp({status:'SIGNED_OUT'});}
    if(!account)return resp({error:{code:'AUTH_REQUIRED',message:'Sign in first'}},401);
    if(url==='/api/state')return resp(snapshot());
    if(url==='/api/commands')try{return resp(dispatch(data.action,data.payload));}
      catch(error){return resp({error:{code:'PREVIEW_ONLY',message:error.message}},409);}
    return resp({error:{code:'NOT_FOUND',message:'Not found'}},404);
  };
  window.resetEmobilityPreview=()=>{previewStore.removeItem(storeKey);db=emptyDb();account=null;window.location.reload();};
})();
</script><script>'use strict';

const fleetSections = [
  {id:'network', label:'Network', roles:['operator'], view:networkStatus},
  {id:'transfers', label:'Transfers', roles:['operator','dispatcher'], view:transferDesk},
  {id:'tickets', label:'Maintenance', roles:['operator','technician'], view:maintenanceDesk},
  {id:'forecast', label:'Demand forecast', roles:['operator'], view:demandForecast},
  {id:'telemetry', label:'Telemetry', roles:['operator'], view:telemetryDesk}
];
let fleetSection = location.hash.slice(1).split('/')[1] || '';
let resourceHub = '';
let transferSource = '';

function fleetWorkspace() {
  const sections = fleetSections.filter(item => item.roles.includes(state.actor.role));
  const current = sections.find(item => item.id === fleetSection) || sections[0];
  return heading('D · Fleet operations', 'Fleet operations',
    {operator:'Monitor hub capacity, coordinate field staff and review vehicle observations.',
      dispatcher:'Collect your assigned vehicles and record their handover at the destination.',
      technician:'Review assigned maintenance tickets and record the outcome of each inspection.'}[state.actor.role]) +
    `<div id="fleet-workspace"><nav class="fleet-sections" aria-label="Fleet tools">${sections.map(item =>
      `<button class="${current === item ? '' : 'secondary'} small" data-fleet-section="${item.id}" ${current === item ? 'aria-current="page"' : ''}>${item.label}</button>`).join('')}</nav>${current.view()}</div>`;
}

const fleetResources = () => [
  ...list('ports').map(item => ({...item, type:'Charging port'})),
  ...list('spots').map(item => ({...item, type:'Parking bay'})),
  ...list('vehicles').map(item => ({...item, type:'Vehicle'}))
];

function networkStatus() {
  const resources = fleetResources();
  const selected = resourceHub || list('hubs')[0]?.id || '';
  const filtered = selected === 'all' ? resources : resources.filter(r=>r.hub_id===selected);
  return `<div class="grid">${list('hubs').map(h => {
    const stale = resources.filter(r => r.hub_id === h.id && r.freshness !== 'FRESH').length;
    return `<article class="record"><div class="record-main"><h2>${esc(h.name)}</h2>${chip(h.level)}</div>
      <div class="record-meta"><span>${h.available} of ${h.capacity} bays available</span><span>${h.effective_percent}% committed</span></div>
      <p class="small-text">${stale ? esc(stale)+' resources awaiting fresh observations' : 'Resource observations are current'}</p>
      <button class="link spaced" data-resource-hub="${esc(h.id)}">Inspect resources →</button></article>`;
  }).join('')}</div>
  <div class="section-heading"><h2>Resources</h2><label>Location<select data-resource-filter>${option('all','All locations',selected==='all')}${list('hubs').map(h=>option(h.id,h.name,h.id===selected)).join('')}</select></label></div>
  <div class="table-wrap"><table><thead><tr><th>Resource</th><th>Location</th><th>Condition</th><th>Observation</th><th>Availability control</th></tr></thead><tbody>${filtered.map(r=>
    `<tr><td><strong>${esc(r.id)}</strong><br>${esc(r.type)}</td><td>${esc(hubName(r.hub_id))}</td><td>${chip(r.health)}</td><td>${chip(r.freshness)}<br>${date(r.observed_at)}</td><td>${['OPERABLE','DEACTIVATED'].includes(r.health) && !r.maintenance_ticket_id ?
      actionButton(r.health==='DEACTIVATED'?'Reactivate':'Deactivate','d_resource_state',{resource_id:r.id,active:r.health==='DEACTIVATED'},'secondary small') : 'Under maintenance'}</td></tr>`
  ).join('')}</tbody></table></div>`;
}

function vehicleChecks(ids, labelFor) {
  return ids.map(id => `<label class="check-label"><input name="vehicle_ids" type="checkbox" value="${esc(id)}">${esc(labelFor(id))}</label>`).join('');
}

function transferFields() {
  const source = transferSource || list('hubs')[0]?.id;
  const vehicles = list('vehicles').filter(v => v.hub_id === source && v.kind === 'shared' && v.transferable);
  const destinations = list('hubs').filter(h => h.id !== source);
  return `<div class="form-row"><label>Source hub<select name="source_hub_id" data-transfer-source required>${list('hubs').map(h=>option(h.id,h.name,h.id===source)).join('')}</select></label>
    <label>Destination hub<select name="dest_hub_id" required>${destinations.map(h=>option(h.id,h.name)).join('')}</select></label></div>
    <fieldset class="vehicle-checks"><legend>Available shared vehicles</legend>${vehicles.length ? vehicleChecks(vehicles.map(v=>v.id),id=>id) : '<p class="muted">No eligible vehicle at this hub.</p>'}</fieldset>
    <label class="check-label"><input type="checkbox" name="charging_bays">Reserve charging bays at the destination</label>
    <label>Assigned staff<select name="staff_id">${option('dispatcher','Dispatcher')}</select></label>
    <button type="submit" ${vehicles.length && destinations.length ? '' : 'disabled'}>Preview transfer</button>`;
}

function transferOrder(order) {
  const operator = state.actor.role === 'operator';
  const delivered = order.delivered;
  const pendingIds = order.pending;
  const remaining = order.vehicle_ids.filter(id=>!delivered.includes(id) && !pendingIds.includes(id));
  let controls = '';
  if (operator && order.status === 'DRAFT') {
    controls = actionButton('Issue transfer','transfer_issue',{order_id:order.id},'small');
  } else if (!operator && order.status === 'ISSUED') {
    controls = actionButton('Start transfer','transfer_start',{order_id:order.id},'small');
  } else if (!operator && order.status === 'IN_PROGRESS' && remaining.length) {
    controls = `<form class="form" data-command="transfer_handover"><input type="hidden" name="order_id" value="${esc(order.id)}">
      <fieldset class="vehicle-checks"><legend>Vehicles presented at destination</legend>${vehicleChecks(remaining,id=>id)}</fieldset><button type="submit">Request handover</button></form>`;
  }
  return `<article class="record"><div class="record-main"><div><h3>${esc(hubName(order.source_hub_id))} → ${esc(hubName(order.dest_hub_id))}</h3><span class="record-id">${esc(order.id)}</span></div>${chip(order.status)}</div>
    <div class="record-meta"><span>Assigned to ${esc(order.staff_id)}</span><span>${delivered.length} / ${order.vehicle_ids.length} delivered</span></div>
    <p class="small-text">Vehicles · ${esc(order.vehicle_ids.join(', '))}${order.charging_bays?' · Charging bays requested':''}</p>
    ${delivered.length ? `<p class="small-text">Delivered · ${esc(delivered.join(', '))}</p>` : ''}
    ${pendingIds.length ? `<p class="record-note">Awaiting evidence · ${esc(pendingIds.join(', '))}${operator?' <button class="link" data-tab="operations">Open device outbox →</button>':''}</p>` : ''}
    ${controls ? `<div class="record-actions">${controls}</div>` : ''}</article>`;
}

function transferDesk() {
  const operator = state.actor.role === 'operator';
  const orders = list('orders').slice().reverse();
  const listing = `<section><div class="section-heading"><h2>${operator ? 'Transfer orders' : 'Assigned transfers'}</h2></div><div class="records">${orders.length ?
    orders.map(transferOrder).join('') : empty('No transfer orders',operator?'Preview a transfer to create a draft.':'Issued orders assigned to you appear here.')}</div></section>`;
  if (!operator) return listing;
  return `<div class="split">${listing}<section class="card"><div class="card-body"><h2>Plan a transfer</h2><form class="form spaced" data-command="transfer_preview">${transferFields()}</form></div></section></div>`;
}

function maintenanceTicket(ticket) {
  const isAssigned = state.actor.role === 'technician' && ticket.technician_id === state.actor.id;
  return `<article class="record"><div class="record-main"><div><h3>${esc(ticket.resource_id)}</h3><span class="record-id">${esc(ticket.id)}</span></div>${chip(ticket.status)}</div>
    <p class="spaced">${esc(ticket.message)}</p><div class="record-meta"><span>Assigned to ${esc(ticket.technician_id)}</span>${ticket.origin_incident_id?`<span>Source report · ${esc(ticket.origin_incident_id)}</span>`:''}</div>
    ${ticket.response?`<p class="record-note">${esc(ticket.response)}</p>`:''}
    ${isAssigned && ticket.status==='OPEN' ? `<form class="form spaced" data-command="d_update_incident">
      <input type="hidden" name="incident_id" value="${esc(ticket.id)}">
      <label>Inspection outcome<select name="outcome"><option value="ESCALATED_WORKSHOP">Escalate to workshop</option><option value="RESOLVED">Resolve and restore service</option></select></label>
      <label>Inspection notes<textarea name="note" required minlength="5" maxlength="1000"></textarea></label>
      <label class="check-label" hidden><input type="checkbox" name="safety_passed">I completed the safety checks and the resource passed.</label>
      <button type="submit">Record outcome</button></form>` : ''}</article>`;
}

function maintenanceDesk() {
  const incidents = list('incidents');
  const tickets = incidents.filter(row=>row.kind==='MAINTENANCE').slice().reverse();
  const listing = `<section><div class="section-heading"><h2>Maintenance tickets</h2></div><div class="records">${tickets.length ? tickets.map(maintenanceTicket).join('') : empty('No maintenance tickets')}</div></section>`;
  if (state.actor.role !== 'operator') return listing;
  const resources = fleetResources().filter(r=>!r.maintenance_ticket_id);
  const reports = incidents.filter(i=>i.kind!=='MAINTENANCE' && ['OPEN','WAITING_FOR_D'].includes(i.status) && !i.maintenance_ticket_id);
  return `<div class="split">${listing}<section class="card"><div class="card-body"><h2>Open a ticket</h2>
    <p class="muted small-text spaced">Opening a ticket isolates the resource and assigns it to the technician.</p><form class="form spaced" data-command="d_open_incident">
    <label>Affected resource<select name="resource_id" required>${option('','Select a resource')}${resources.map(r=>option(r.id,`${r.id} · ${r.type}`)).join('')}</select></label>
    <label>Source report (optional)<select name="origin_incident_id">${option('','Direct inspection')}${reports.map(i=>option(i.id,`${i.id} · ${i.message}`)).join('')}</select></label>
    <label>Issue description<textarea name="message" required minlength="5" maxlength="1000"></textarea></label><button type="submit">Open maintenance ticket</button></form></div></section></div>`;
}

function demandForecast() {
  const scenarios = list('scenarios').slice().reverse();
  return `<div class="split"><section><div class="section-heading"><h2>Demand scenarios</h2></div><div class="records">${scenarios.length ? scenarios.map(s => `<article class="record"><h3>${esc(hubName(s.hub_id))} · ${esc(s.demand_factor)}× demand</h3><span class="record-id">${esc(s.id)}</span>
    <div class="table-wrap spaced"><table><thead><tr><th>Hub</th><th>Current load</th><th>Projected load</th></tr></thead><tbody>${s.impact.map(h=>`<tr><td>${esc(hubName(h.hub_id))}</td><td>${esc(h.current_percent)}%</td><td>${esc(h.projected_percent)}%</td></tr>`).join('')}</tbody></table></div>
    ${s.recommendations.length ? s.recommendations.map((r,i)=>`<div class="record-note"><p>${esc(hubName(r.source_hub_id))} → ${esc(hubName(r.dest_hub_id))} · ${esc(r.vehicle_ids.join(', '))}</p><div class="record-actions">${actionButton('Create transfer draft','what_if_draft',{scenario_id:s.id,recommendation_index:i},'secondary small')}</div></div>`).join('') : '<p class="record-note">No transfers recommended for this scenario.</p>'}</article>`).join('') : empty('No forecasts yet')}</div></section>
    <section class="card"><div class="card-body"><h2>Model a change in demand</h2><form class="form spaced" data-command="what_if">
      <label>Target hub<select name="hub_id" required>${hubOptions()}</select></label><label>Demand multiplier<input type="number" min="0.5" max="3" step="0.1" name="demand_factor" value="1.5" required></label><button type="submit">Run forecast</button>
      <p class="form-help">Review the projected load before creating any transfer orders.</p></form></div></section></div>`;
}

function telemetryRows(vehicles) {
  const packets = vehicles.map(v=>v.last_telemetry).filter(Boolean).sort((a,b)=>b.observed_at-a.observed_at);
  return packets.length ? `<div class="records">${packets.map(p=>`<article class="record"><div class="record-main"><h3>${esc(p.resourceId)}</h3>${chip('SIMULATED')}</div>
    <div class="record-meta"><span>${date(p.observed_at)}</span><span>Packet ${esc(p.sequence)}</span></div>
    <p>${esc(p.batterySoc)}% battery${p.speed!=null?' · '+esc(p.speed)+' km/h':''}${p.temperatureC!=null?' · '+esc(p.temperatureC)+' °C':''}</p>
    ${p.destinationHubId?`<p class="small-text">Destination · ${esc(hubName(p.destinationHubId))}</p>`:''}
    ${p.alerts?.length?`<div class="record-note">${esc(p.alerts.map(title).join(' · '))}</div>`:''}</article>`).join('')}</div>` : empty('No vehicle readings received');
}

function telemetryDesk() {
  const vehicles = list('vehicles');
  const listing = `<section><div class="section-heading"><h2>Latest vehicle readings</h2>
    <label class="check-label"><input type="checkbox" id="live-telemetry" checked>Live updates</label></div>
    <div id="telemetry-readings">${telemetryRows(vehicles)}</div></section>`;
  if (!state.simulator) return listing;
  return `<div class="split">${listing}<section class="sim-area"><h2>Simulate a vehicle reading</h2>
    <form class="form spaced" data-command="d_telemetry"><label>Vehicle<select name="resourceId" required>${vehicles.map(v=>option(v.id,v.id)).join('')}</select></label>
    <label>Battery charge (%)<input type="number" min="0" max="100" step="0.1" name="batterySoc" value="65" required></label>
    <div class="form-row"><label>Speed (km/h)<input type="number" min="0" step="0.1" max="500" name="speed" value="0"></label><label>Temperature (°C)<input type="number" step="0.1" min="-80" max="250" name="temperatureC" value="27"></label></div>
    <label>Destination (optional)<select name="destinationHubId">${option('','No destination')}${list('hubs').map(h=>option(h.id,h.name)).join('')}</select></label>
    <button type="submit">Send simulated reading</button></form></section></div>`;
}

function prepareFleetCommand(form, values, payload) {
  if (form.elements.vehicle_ids) {
    payload.vehicle_ids = values.getAll('vehicle_ids');
    if (!payload.vehicle_ids.length) {
      showNotice('Select at least one vehicle for this transfer.', true);
      return false;
    }
  }
  if (form.elements.charging_bays) payload.charging_bays = form.elements.charging_bays.checked;
  if (form.elements.safety_passed) payload.safety_passed = form.elements.safety_passed.checked;
  for (const field of ['demand_factor','batterySoc','speed','temperatureC']) {
    if (payload[field] !== undefined && payload[field] !== '') payload[field] = Number(payload[field]);
  }
  for (const field of ['origin_incident_id','destinationHubId','speed','temperatureC']) {
    if (payload[field] === '') delete payload[field];
  }
  if (form.dataset.command === 'd_telemetry') payload.event_id = crypto.randomUUID();
  return true;
}

// Update the packet list in place so an operator can finish entering a reading.
let readingTelemetry = false;
setInterval(async () => {

</script><script>'use strict';

const app = document.querySelector('#app');
const notice = document.querySelector('#notice');
let state = null;
let tab = location.hash.slice(1).split('/')[0] || 'overview';
let selectedHub = '';
let busy = false;
let noticeTimer;
const tabs = [
  ['overview', '◈', 'Explore hubs'], ['journeys', '↗', 'My journeys'],
  ['parking', '▦', 'Parking'], ['charging', 'ϟ', 'Charging'],
  ['support', '◎', 'Support'], ['operations', '≋', 'Operations'],
  ['network', '⇄', 'Fleet operations'], ['history', '◷', 'Activity']
];
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = key => Array.isArray(state?.[key]) ? state[key] : [];
const find = (key, id) => list(key).find(row => row.id === id);
const title = value => String(value || '').replaceAll('_', ' ').toLowerCase().replace(/^./, c => c.toUpperCase());
const date = value => value ? new Date(value * 1000).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const inputDate = value => { const d = new Date(value * 1000); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0,16); };
const now = () => state?.now || Date.now()/1000;
const hubName = id => find('hubs', id)?.name || id || 'In transit';
const vehicleName = id => {const v = find('vehicles', id); return v ? `${v.label || v.id} · ${v.kind === 'shared' ? 'Shared' : 'Personal'}` : id;};
const statusClass = status => /PENDING|UNKNOWN|STALE|WARNING|RESERVED|BOOKED|PROPOSED|WAIT|DRAFT|ASSISTANCE/i.test(status) ? 'warn' : /FAULT|REJECT|OUT_OF_SERVICE|EXPIRED|CANCEL|CLOSED_UNFULFILLED/i.test(status) ? 'bad' : /ACTIVE|AVAILABLE|CONFIRM|OPEN|CLOSED|COMPLETED|ACK|APPLIED|OPERABLE|EMPTY|UNPLUGGED/i.test(status) ? 'good' : 'neutral';
const chip = status => `<span class="chip ${statusClass(status)}">${esc(title(status))}</span>`;
const actionButton = (label, action, payload, style='secondary small') => `<button class="${style}" data-action="${esc(action)}" data-payload="${esc(JSON.stringify(payload))}">${esc(label)}</button>`;
const option = (value, label, selected=false) => `<option value="${esc(value)}" ${selected?'selected':''}>${esc(label)}</option>`;
const empty = (heading, text='') => `<div class="empty"><strong>${esc(heading)}</strong>${esc(text)}</div>`;
const pendingKey = () => `emobility_pending_${state?.actor?.id}`;
const pending = () => {try{return JSON.parse(previewStore.getItem(pendingKey()) || 'null');}catch{return null;}};

async function request(path, data) {
  const response = await fetch(path, {method:data === undefined?'GET':'POST', credentials:'same-origin', headers:data === undefined?{}:{'Content-Type':'application/json'}, body:data === undefined?undefined:JSON.stringify(data)});
  const result = await response.json();
  if (!response.ok) {const error = new Error(result.error?.message || 'Request failed.'); error.code=result.error?.code; error.status=response.status; throw error;}
  return result;
}

function showNotice(message, error=false, retry=false) {
  clearTimeout(noticeTimer);
  notice.hidden = false;
  notice.className = `notice${error?' error':''}`;
  notice.innerHTML = `<span>${esc(message)}</span><button data-notice="${retry?'retry':'close'}">${retry?'Retry same request':'Dismiss'}</button>`;
  if (!error && !retry) noticeTimer = setTimeout(()=>notice.hidden=true, 9000);
}

async function refresh(renderView=true) {
  try {
    state = await request('/api/state');
    if (renderView) render();
    return true;
  } catch (error) {
    if (error.status === 401) {state=null;renderLogin();}
    else showNotice(`Unable to refresh: ${error.message}`, true);
    return false;
  }
}

async function command(action, payload, retry=false) {
  if (busy) return;
  const saved = pending();
  if (saved && !retry) return showNotice('A previous request has an uncertain outcome. Recover it before submitting another change.', true, true);
  const envelope = retry ? saved : {action, payload, intent_id:(crypto.randomUUID ? crypto.randomUUID() : 'demo-'+Date.now()+'-'+Math.random().toString(36).slice(2))};
  if (!envelope) return;
  busy = true;
  previewStore.setItem(pendingKey(), JSON.stringify(envelope));
  const locks = document.querySelectorAll('button[data-action]:enabled, form button[type=submit]:enabled, #logout');
  locks.forEach(button=>button.disabled=true);
  try {
    const result = await request('/api/commands', envelope);
    previewStore.removeItem(pendingKey());
    await refresh();
    const outcome = result.record?.status || result.status;
    if (outcome === 'ANOMALY' || outcome === 'REJECTED') {
      showNotice(`${title(outcome)}. ${result.record.reason || 'Review the command and resource state in the device outbox.'}`, true);
    } else if (result.status === 'PENDING_VERIFICATION') {
      showNotice('Request recorded. Awaiting handover or device evidence.');
    } else {
      showNotice(`${title(outcome || 'Saved')}. Your records are updated.`);
    }
  } catch (error) {
    if (error.status && error.status < 500) {
      previewStore.removeItem(pendingKey());
      if (error.status === 401) {state=null;renderLogin();}
      showNotice(`${error.code ? title(error.code)+': ' : ''}${error.message}`, true);
    } else showNotice('The response was lost or the server could not confirm the outcome. Retry the same request to recover its recorded result.', true, true);
  } finally {
    busy=false;
    locks.forEach(button=>button.disabled=false);
  }
}

d.</p><form class="form spaced" data-command="return_vehicle"><label>Open trip<select name="trip_id" required>${option('','Choose a trip')}${openTrips.map(t=>option(t.id,`${t.id} · ${t.vehicle_id}`)).join('')}</select></label><label>Destination hub<select name="hub_id" required>${hubOptions()}</select></label><label>Existing return parking right (optional)<select name="right_id">${option('','Request walk-in reception')}${list('rights').filter(r=>['CONFIRMED','HANDOVER_PENDING'].includes(r.status)).map(r=>option(r.id,`${r.id} · ${hubName(r.hub_id)} · ${r.vehicle_id}`)).join('')}</select></label><button type="submit">Request return</button></form></div></div><div class="card spaced"><div class="card-body"><h3>Need a place at your destination?</h3><p class="muted small-text spaced">A hold does not include a return bay. Reserve a separate shared-vehicle parking right before arrival.</p><button class="link spaced" data-tab="parking">Reserve parking →</button></div></div></aside></div>`;

  const eligibleRights=list('rights').filter(r=>['CONFIRMED','CONSUMED'].includes(r.status));
  return heading('C · Charging services', 'Charge with confidence', 'A booked session is an allocation. Plugging in, starting, stopping and unplugging each require external evidence.')+
    `<div class="split"><section><div class="section-heading"><h2>Charging sessions</h2><button class="link" data-tab="parking">Book parking + charging →</button></div><div class="records">${sessions.length?sessions.map(s=>{const port=find('ports',s.port_id);return `<article class="record"><div class="record-main"><div><div class="record-title"><h3>${esc(vehicleName(s.vehicle_id))}</h3><span class="record-id">${esc(s.id)}</span></div><div class="record-meta"><span>Port ${esc(s.port_id)}</span><span>Target ${esc(s.target_soc)}%</span><span>${esc(s.kw||'—')} kW</span></div><p class="muted small-text">Window ${date(s.start)} → ${date(s.end)}</p><p class="muted small-text">Scheduled ${date(s.scheduled_start)} → ${date(s.scheduled_end)}</p></div>${chip(s.status)}</div><div class="record-note">Physical port: ${esc(title(port?.plug||'UNKNOWN'))} · Power ${esc(title(port?.power||'UNKNOWN'))} · ${esc(title(port?.health||'UNKNOWN'))}</div><div class="record-actions">${s.status==='BOOKED'?actionButton('Request plug-in','plug',{session_id:s.id},'small')+actionButton('Request start','start_charge',{session_id:s.id},'small')+actionButton('Cancel unused session','cancel_charge',{session_id:s.id},'danger small'):''}${['CHARGING','START_PENDING','STOP_PENDING'].includes(s.status)?actionButton('Request stop','stop_charge',{session_id:s.id},'small'):''}${['COMPLETED','CANCELLED','INTERRUPTED','BOOKED'].includes(s.status)&&port?.plug==='CONNECTED'?actionButton('Request unplug','unplug',{session_id:s.id},'secondary small'):''}</div>${s.status==='COMPLETED'?'<p class="muted small-text spaced">Session complete. The port remains occupied until unplugging is observed; the parking bay remains occupied until departure.</p>':''}</article>`;}).join(''):empty('No charging sessions','Create a parking + charging bundle, or add charging to a compatible existing right.')}</div><div class="section-heading"><h2>Ports and observations</h2></div><div class="table-wrap"><table><thead><tr><th>Port / bay</th><th>Connection</th><th>Power</th><th>Health</th><th>Observation</th></tr></thead><tbody>${list('ports').map(p=>`<tr><td>${esc(p.id)} / ${esc(p.spot_id)}</td><td>${chip(p.plug)}</td><td>${chip(p.power)}</td><td>${chip(p.health)}</td><td>${chip(p.freshness||(now()-p.observed_at>90?'STALE':'FRESH'))}</td></tr>`).join('')}</tbody></table></div></section><aside><div class="card"><div class="card-body"><div class="eyebrow">Use an existing parking right</div><h2>Add charging</h2><form class="form spaced" data-command="register_charge"><label>Parking right<select name="right_id" required>${option('','Choose a compatible right')}${eligibleRights.map(r=>option(r.id,`${r.id} · ${r.vehicle_id} · ${r.spot_id}`)).join('')}</select></label><label>Target SOC (%)<input type="number" name="target_soc" min="1" max="100" value="80" required></label><button type="submit">Reserve charging</button><p class="form-help">The right must cover the session window and belong to a compatible charging bay. Independently created parking rights are preserved when charging is canceled.</p></form></div></div><div class="card spaced"><div class="card-body"><h3>How a session progresses</h3><ol class="review-list"><li>Reserve parking and charging.</li><li>Request arrival; await accepted evidence.</li><li>Request plug-in; await connection evidence.</li><li>Request start; await power-on acknowledgement.</li><li>Request stop; await power-off acknowledgement.</li><li>Request unplug, then parking departure.</li></ol></div></div></aside></div>`;
}

function receptionOffer(incident) {
  const right = find('rights',incident.offered_right_id);
  if (!right) return '';
  return `<div class="record-note"><strong>Proposed reception · ${esc(hubName(right.hub_id))}</strong>
    <p>Bay ${esc(right.spot_id)} for ${esc(vehicleName(right.vehicle_id))}. Respond by ${date(incident.offer_expires_at)}.</p></div>`;
}

function support() {
  const records=[...list('holds'),...list('trips'),...list('rights'),...list('visits'),...list('sessions')];
  return heading('A + B · Journey assistance', 'Support that stays with you', 'Keep a traceable record of an issue or reception problem. Operator proposals require your response and never close a trip by themselves.')+
    `<div class="split"><section><div class="section-heading"><h2>Support records</h2></div><div class="records">${list('incidents').length?list('incidents').slice().reverse().map(i=>`<article class="record"><div class="record-main"><div><h3>${esc(i.message||'Reception assistance')}</h3><div class="record-meta"><span class="record-id">${esc(i.id)}</span><span>Related record ${esc(i.record_id)}</span></div></div>${chip(i.status)}</div>${i.response?`<div class="record-note">${esc(typeof i.response==='string'?i.response:JSON.stringify(i.response))}</div>`:''}${i.status==='OFFERED' ? receptionOffer(i) : ''}${state.actor.role==='student'&&i.status==='OFFERED'?`<div class="record-actions">${actionButton('Accept proposed reception','accept_capacity',{incident_id:i.id,accept:true},'small')}${actionButton('Decline proposal','accept_capacity',{incident_id:i.id,accept:false},'danger small')}</div>`:''}</article>`).join(''):empty('No support records','You can report an issue against one of your own service records.')}</div></section><aside><div class="card"><div class="card-body"><h2>Request support</h2><form class="form spaced" data-command="support"><label>Related service<select name="record_id" required>${option('','Select a service record')}${records.map(r=>option(r.id,`${r.id} · ${r.vehicle_id||r.status}`)).join('')}</select></label><label>What happened?<textarea name="message" required minlength="5" maxlength="1000" placeholder="Describe the problem and where you are."></textarea></label><button type="submit">Send support request</button><p class="form-help">An operator can use this report to open a maintenance ticket for the affected resource.</p></form></div></div></aside></div>`;
}

function operations() {
  const commands=list('commands');
  const capacityCases=list('incidents').filter(i => {
    if (!['OPEN','WAITING_FOR_D','DECLINED'].includes(i.status)) return false;
    const trip=find('trips',i.record_id), right=find('rights',i.record_id);
    return (trip && trip.status!=='CLOSED') || right?.status==='CONFIRMED';
  });
  const fleetVehicles=list('vehicles').filter(v => v.kind==='shared' && !v.transfer_order_id &&
    v.health==='OPERABLE' && v.soc < 100 && list('ports').some(p=>p.spot_id===v.spot_id && p.connector===v.connector));
  return heading('Operator workspace', 'Keep the network moving', 'Review reception proposals and charging schedules. Confirming a plan does not assert that a physical movement has happened.')+
    `<div class="grid two"><div class="card"><div class="card-body"><div class="eyebrow">B05 · Recovery capacity</div><h2>Propose a reception option</h2><form class="form spaced" data-command="capacity_plan"><label>Support case<select name="incident_id" required>${option('','Choose an unresolved case')}${capacityCases.map(i=>option(i.id,`${i.id} · ${i.message||i.record_id}`)).join('')}</select></label><label>Recovery hub<select name="hub_id" required>${hubOptions()}</select></label><label>Reason for reserve capacity<input name="reason" required minlength="5" maxlength="500" placeholder="Protect reception for an interrupted journey"></label><button type="submit">Propose reception</button><p class="form-help">Capacity is rechecked; existing commitments are protected. The owner must accept the proposal before requesting handover.</p></form></div></div><div class="card"><div class="card-body"><div class="eyebrow">C03 · Charging allocation</div><h2>Preview the charging schedule</h2><p class="muted spaced">Build a plan using current session demand, port compatibility, fresh observations and hub power limits. Confirmation checks the current revision again.</p><div class="record-actions">${actionButton('Create schedule preview','schedule_preview',{},'')}</div><div class="records spaced">${list('plans').filter(p=>p.kind!=='capacity').slice().reverse().map(p=>`<article class="record"><div class="row-spread"><span class="record-id">${esc(p.id)}</span>${chip(p.status)}</div><div class="record-actions"><button class="secondary small" data-detail="plans" data-id="${esc(p.id)}">Review allocation</button>${['DRAFT','PROPOSED','PREVIEW'].includes(p.status)?actionButton('Confirm schedule','schedule_confirm',{plan_id:p.id},'small'):''}</div></article>`).join('')||'<p class="muted small-text">No schedule previews yet.</p>'}</div></div></div></div>`+
    `<section class="card spaced"><div class="card-body"><h2>Schedule fleet charging</h2>
      ${fleetVehicles.length?`<form class="form spaced" data-command="fleet_charge"><div class="form-row">
      <label>Fleet vehicle at a charging bay<select name="vehicle_id" required>${fleetVehicles.map(v=>option(v.id,`${v.id} · ${v.spot_id} · ${v.soc}%`)).join('')}</select></label>
      <label>Target charge (%)<input type="number" name="target_soc" min="1" max="100" value="90" required></label></div>
      <button type="submit">Book fleet charging</button></form>`:'<p class="muted spaced">A shared vehicle must be parked at a compatible charging bay before scheduling.</p>'}
      <button class="link spaced" data-tab="charging">Manage charging sessions →</button></div></section>`+
    `<div class="section-heading"><h2>Device command outbox</h2><span class="muted small-text">Persisted intent · acknowledgement required</span></div><div class="records">${commands.length?commands.slice().reverse().map(c=>`<article class="record"><div class="record-main"><div><div class="record-title"><h3>${esc(title(c.kind))}</h3><span class="record-id">${esc(c.id)}</span></div><div class="record-meta"><span>Record ${esc(c.record_id)}</span>${c.vehicle_id?`<span>Vehicle ${esc(c.vehicle_id)}</span>`:''}<span>Created ${date(c.created_at)}</span></div></div>${chip(c.status)}</div>${state.simulator&&!['ACK','ACKNOWLEDGED','CONFIRMED','APPLIED','REJECTED','COMPLETED'].includes(c.status)?`<div class="record-actions">${actionButton('Simulate ACK','simulate',{command_id:c.id,outcome:'ACK'},'small')}${actionButton('Simulate rejection','simulate',{command_id:c.id,outcome:'REJECT'},'danger small')}${actionButton('Simulate unknown outcome','simulate',{command_id:c.id,outcome:'UNKNOWN'},'secondary small')}</div><p class="muted small-text spaced">Synthetic test evidence only. No device is contacted.</p>`:''}</article>`).join(''):empty('No pending device requests','Student requests for handover and charging are recorded here.')}</div>`+
    (state.simulator?`<section class="sim-area spaced"><div class="row-spread"><div><div class="eyebrow">Controlled test environment</div><h2>Synthetic observation controls</h2></div>${actionButton('Refresh simulated observations','sim_refresh',{},'secondary small')}</div><p class="muted small-text spaced">Refresh renews only simulated observations. Fault controls exercise eligibility and failure handling. These controls are disabled unless the server starts with --simulator.</p><form class="form spaced" data-command="sim_observe"><div class="form-row"><label>Resource<select name="resource_ref">${['ports','vehicles','spots'].flatMap(key=>list(key).map(r=>option(`${key}:${r.id}`,`${title(key)} · ${r.id}`))).join('')}</select></label><label>Technical condition<select name="health">${option('OUT_OF_SERVICE','Out of service')}${option('OPERABLE','Operable')}</select></label></div><button type="submit" class="secondary">Submit synthetic observation</button></form></section>`:'')+
    `<div class="section-heading"><h2>Unresolved assistance</h2><button class="link" data-tab="support">View support records →</button></div><p class="muted">${list('incidents').filter(i=>!['RESOLVED','CLOSED'].includes(i.status)).length} support records need review. <button class="link" data-tab="network">Open fleet operations →</button></p>`;
}

function activityHistory() {
  return heading('Evidence and history', 'Every change leaves a trace', 'Recorded actions, outcomes and revisions from persisted state. Synthetic observations remain explicitly identified.')+
    (list('audit').length?`<div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead><tbody>${list('audit').slice().reverse().map(a=>`<tr><td>${date(a.at)}</td><td>${esc(a.actor_id||a.actor||'system')}</td><td>${esc(title(a.action||a.kind))}</td><td class="history-detail">${esc(JSON.stringify(Object.fromEntries(Object.entries(a).filter(([key])=>!['id','at','actor_id','actor','action','kind'].includes(key)))))}</td></tr>`).join('')}</tbody></table></div>`:empty('No activity recorded yet','Complete a reservation or request to begin your history.'));
}

app.addEventListener('click', async event => {
  const button=event.target.closest('button');
  if (!button) return;
  if (button.dataset.tab) {
    tab=button.dataset.tab;
    (window.location.hash = '#' + tab);
    render();
    window.scrollTo(0,0);
  }
  else if (button.dataset.hub) {selectedHub=button.dataset.hub;render();document.querySelector('#hub-filter')?.scrollIntoView({behavior:'smooth',block:'center'});}
  else if (button.dataset.action) await command(button.dataset.action, JSON.parse(button.dataset.payload));
  else if (button.id==='refresh') await refresh();
  else if (button.id==='logout') {try {await request('/api/logout',{});state=null;notice.hidden=true;(window.location.hash = '');renderLogin();}catch(error){showNotice(error.message,true);}}
  else if (button.dataset.detail) {const record=find(button.dataset.detail,button.dataset.id);document.querySelector('#detail-content').innerHTML=`<h2>Review ${esc(record?.id)}</h2><p class="muted spaced">Review the proposed allocations before confirming. Confirmation rechecks this plan against current state.</p><pre>${esc(JSON.stringify(record,null,2))}</pre>`;document.querySelector('#detail-dialog').showModal();}
});

app.addEventListener('change', event => {
  if (event.target.id==='hub-filter') {selectedHub=event.target.value;render();}
});

app.addEventListener('submit', async event => {
  event.preventDefault();
  const form=event.target;
  if (form.id==='login-form') {
    const submit=form.querySelector('button'); submit.disabled=true;
    try {
      const {actor}=await request('/api/login',Object.fromEntries(new FormData(form)));
      tab=actor.role==='student'?'overview':'network';
      (window.location.hash = '#'+tab);
      await refresh();
    }
    catch(error) {document.querySelector('#login-error').textContent=error.message;}
    finally {submit.disabled=false;}
    return;
  }
  if (!form.dataset.command) return;
  const values=new FormData(form);
  const payload=Object.fromEntries(values);
  if (form.closest('#fleet-workspace') && !prepareFleetCommand(form, values, payload)) return;
  for (const key of ['start','end']) if (key in payload) payload[key]=new Date(payload[key]).getTime()/1000;
  for (const key of ['target_soc','battery_kwh','soc']) if (key in payload) payload[key]=Number(payload[key]);
  if (form.dataset.command==='reserve_parking') payload.charging=form.elements.charging.checked;
  for (const key of ['right_id','hold_id']) if (payload[key]==='') delete payload[key];
  if (payload.resource_ref) {const [resource_type,resource_id]=payload.resource_ref.split(':');delete payload.resource_ref;Object.assign(payload,{resource_type,resource_id});}
  await command(form.dataset.command,payload);
});

notice.addEventListener('click', event => {
  const button=event.target.closest('button');
  if (button?.dataset.notice==='retry') command(null,null,true);
  else if (button) notice.hidden=true;
});
document.querySelector('#close-dialog').addEventListener('click',()=>document.querySelector('#detail-dialog').close());
refresh();
</script></body>
</html>
